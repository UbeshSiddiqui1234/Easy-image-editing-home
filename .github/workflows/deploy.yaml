name: Deploy on push

on:
  push:
    branches:
      - main

# One deploy at a time; a newer push waits for the running one
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # Static site: nginx serves this checkout directly, so there is no build or restart step
            cd /var/www/easy-image-editing-home
            git pull --ff-only origin main
            git log --oneline -1
